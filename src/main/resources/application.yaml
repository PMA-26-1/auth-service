server:
  port: 8080

spring:
  application:
    name: auth

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000    # 5 minutes in milliseconds
      cache-null-values: false

store:
  jwt:
    secretKey: ${JWT_SECRET_KEY}
    duration: 86400000 # 24hr in ms
    httpOnly: ${JWT_HTTP_ONLY}

logging:
  level:
    root: info
    store: debug
    org.springframework.web: debug

management:
  endpoints:
    web:
      base-path: /auth/actuator
      exposure:
        include: ['prometheus']